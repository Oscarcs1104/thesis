# Example configuration for training the hybrid model
# Edit values here instead of passing CLI arguments.

# Data
data-path: data/esol.csv,data/freesolv.csv,data/lipo.csv
lang-path: null

# Task
task: regression
output-dim: 1

# Model
hidden-dim: 256
num-layers: 3
num-heads: 8
dropout: 0.3
graph-backbone: gin
language-backbone: chemberta
fusion: concat
use-language: true

# Node features
node-encoding: categorical
node-vocab-sizes: [119, 4]

# Training
batch-size: 32
epochs: 50
lr: 0.001
weight-decay: 0.0001
train-ratio: 0.8
val-ratio: 0.1
test-ratio: 0.1
seed: 2025
patience: 20
checkpoint-path: null
device: cuda
