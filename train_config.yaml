# Reference configuration for training/train.py (the multimodal property predictor).
# Prefer a predefined scaffold split via --dataset-dir; --data-path is the internal
# fallback and re-splits by scaffold.

# Data (predefined DeepChem scaffold split, from data_pipeline/prepare_all.py)
dataset-dir: data/deepchem_molnet/delaney   # esol; or .../freesolv, .../lipo

# Task
task: regression
output-dim: 1

# Model
hidden-dim: 256
num-layers: 3
dropout: 0.3
graph-backbone: gin        # GIN-E; consumes OGB-style atom + bond features
language-backbone: huggingface
language-model-name: DeepChem/ChemBERTa-77M-MLM
use-language: true
use-graph: true
freeze-language-backbone: true

# Training
batch-size: 32
epochs: 100
lr: 0.001
weight-decay: 0.0001
lr-schedule: plateau
warmup-epochs: 5
grad-clip: 1.0
standardize-target: true
seeds: [2025, 2026, 2027]
patience: 20
device: cuda
